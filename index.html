<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
    max-width:900px;
}

img{
    max-width:100%;
    border-radius:10px;
    box-shadow:0 0 20px rgba(255,255,255,.15);
}

input{
    margin-top:20px;
    width:320px;
    max-width:90%;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:8px;
    outline:none;
}

button{
    margin-top:15px;
    padding:12px 28px;
    font-size:17px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

#error{
    margin-top:15px;
    color:#ff6666;
    height:24px;
}
</style>
</head>
<body>

<div class="container">
    <img src="AKAhdKWGDGK.png" alt="Puzzle">

    <div>
        <input
            id="answer"
            type="text"
            placeholder="Enter the solution..."
            autocomplete="off">
    </div>

    <button onclick="checkAnswer()">Submit</button>

    <div id="error"></div>
</div>

<script>
const solution = "dede te, liber!";

function checkAnswer(){
    const input = document.getElementById("answer").value.trim().toLowerCase();

    if(input === solution){
        window.location.href = "/index/index.html";
    }else{
        document.getElementById("error").textContent = "Incorrect answer.";
    }
}

document.getElementById("answer").addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        checkAnswer();
    }
});
</script>

</body>
</html>
